<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmojiCraft</title>
    <meta
      name="description"
      content="Export any emoji in any style, size, and format."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16.png"
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link rel="manifest" href="assets/site.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Open Graph -->
    <meta property="og:title" content="EmojiCraft" />
    <meta
      property="og:description"
      content="Export any emoji in any style, size, and format."
    />
    <meta property="og:image" content="assets/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  </head>

  <body>
    <!-- ── Top nav ── -->
    <header class="style-nav">
      <div class="style-nav-inner" id="styleSelector"><!-- filled by JS --></div>
      <button id="themeBtn" class="theme-btn" title="Toggle dark mode">
        <!-- light mode → moon invites dark; dark mode → sun invites light -->
        <img class="btn-moon" src="assets/clipart497278.webp" alt="Switch to dark mode" />
        <img class="btn-sun"  src="assets/clipart770858.webp" alt="Switch to light mode" />
      </button>
    </header>

    <!-- ══════════════════════════════════════════════════════════
       APP LAYOUT — left: preview   right: picker
  ══════════════════════════════════════════════════════════ -->
    <div class="app">
      <!-- ── LEFT: preview & export controls ── -->
      <section class="preview-section">
        <!-- Big emoji display -->
        <div class="emoji-display" id="emojiDisplay">
          <div class="emoji-placeholder">
            <span>⚒</span>
            <p>Pick an emoji</p>
          </div>
        </div>

        <!-- Export controls (visible after selection) -->
        <div class="export-controls" id="exportControls">
          <!-- Download button -->
          <button class="dl-btn" id="dlBtn" onclick="handleDownload()">
            <span id="dlBtnLabel">Download</span>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>

          <!-- Format row -->
          <div class="options-row">
            <div class="seg-group" id="fmtGroup">
              <button class="seg seg-active" data-fmt="svg">SVG</button>
              <button class="seg" data-fmt="png">PNG</button>
              <button class="seg" data-fmt="webp">WebP</button>
              <button class="seg" data-fmt="ico">ico</button>
            </div>
          </div>

          <!-- Size row (hidden for SVG) -->
          <div class="options-row" id="sizeRow">
            <div class="seg-group" id="szGroup">
              <button class="seg" data-sz="64">64</button>
              <button class="seg seg-active" data-sz="128">128</button>
              <button class="seg" data-sz="256">256</button>
              <button class="seg" data-sz="512">512</button>
              <button class="seg" data-sz="1024">1024</button>
              <button class="seg" data-sz="custom">…</button>
            </div>
            <input
              type="number"
              id="customSz"
              value="256"
              min="16"
              max="4096"
              placeholder="px"
              class="custom-sz hidden"
            />
          </div>

          <!-- ZIP options -->
          <div class="zip-options">
            <label class="zip-label" id="zipSizesRow">
              <div class="toggle" id="zipSizesTog" onclick="toggleZipMode('sizes')">
                <div class="toggle-knob"></div>
              </div>
              <div class="zip-label-text">
                <span>All sizes</span>
                <small>64 · 128 · 256 · 512 · 1024 px</small>
              </div>
            </label>
            <label class="zip-label">
              <div class="toggle" id="zipFmtsTog" onclick="toggleZipMode('formats')">
                <div class="toggle-knob"></div>
              </div>
              <div class="zip-label-text">
                <span>All formats</span>
                <small>SVG · PNG · WebP</small>
              </div>
            </label>
          </div>

          <!-- Hint -->
          <p class="hint" id="hint">Choose a format and click Download</p>
        </div>

      </section>

      <!-- ── RIGHT: emoji picker card ── -->
      <section class="picker-section">
        <div class="picker-card">
          <!-- Category tabs -->
          <div class="cat-tabs" id="catTabs">
            <!-- filled by JS -->
          </div>

          <!-- Search -->
          <div class="search-row">
            <div class="search-wrap">
              <svg
                class="search-icon"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input
                id="searchInput"
                type="search"
                placeholder="Search"
                autocomplete="off"
                spellcheck="false"
                class="search-input"
              />
            </div>
          </div>

          <!-- Category label + count -->
          <div class="grid-header">
            <span id="gridLabel">All Emojis</span>
            <span id="gridCount" class="grid-count"></span>
          </div>

          <!-- Skeleton -->
          <div id="skeleton" class="skeleton-grid">
            <!-- filled by JS -->
          </div>

          <!-- Grid -->
          <div id="emojiGrid" class="emoji-grid hidden"></div>

          <!-- Empty -->
          <div id="emptyState" class="empty-state hidden">
            <span>🔍</span>
            <p>No results for "<span id="emptyQuery"></span>"</p>
          </div>
        </div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="footerSource" class="footer-source">Powered by System emoji</span>
      <span>Made with 💛 by <a href="https://github.com/albertolicea00" target="_blank" rel="noopener">Alberto</a></span>
      <span class="footer-actions">
        <a class="footer-coffee" href="https://buymeacoffee.com/albertolicea00" target="_blank" rel="noopener">☕ Support</a>
        <a class="footer-github" href="https://github.com/albertolicea00/EmojiCraft" target="_blank" rel="noopener">⭐ Star on GitHub</a>
      </span>
    </footer>

    <!-- Toast -->
    <div id="toast" class="toast">
      <span id="toastIcon"></span>
      <span id="toastText"></span>
    </div>

    <!--
      Soul Eater clipart — thanks to clipartmax.com ♥
        Moon:   https://www.clipartmax.com/middle/m2i8G6G6m2m2i8Z5_drawn-lunar-yellow-soul-eater-moon-png/
        Sun:    https://www.clipartmax.com/middle/m2i8H7G6i8d3A0G6_moon-clipart-soul-eater-soul-eater-sun-png/
        both:   https://www.clipartmax.com/middle/m2H7i8K9d3b1d3d3_soul-eater-pixel-soul-eater-moon/
    -->
    <script src="js/sources.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
