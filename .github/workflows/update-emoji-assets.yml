name: Update Emoji Assets

# ── Triggers ──────────────────────────────────────────────────────
on:
  workflow_dispatch:        # manual trigger from GitHub UI → Actions tab
  # schedule:
  #   - cron: '0 4 1 * *'  # 1st of every month, 04:00 UTC — uncomment to enable

# ── Job ───────────────────────────────────────────────────────────
jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download emoji assets
        # No --force → skips files already committed. Only new/changed emojis are downloaded.
        # If nothing changed, create-pull-request detects no diff and skips PR creation automatically.
        run: python3 scripts/download-assets.py --jobs 16

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-emoji-assets
          base: main
          title: "chore: update self-hosted emoji assets"
          body: |
            Auto-generated by the **Update Emoji Assets** workflow.

            ### What changed
            **SVG styles**
            - `assets/emoji/noto/` — Noto SVGs (Google)
            - `assets/emoji/openmoji/` — OpenMoji SVGs
            - `assets/emoji/joypixels/` — JoyPixels SVGs

            **PNG styles** (64 px, from `emoji-datasource-*`)
            - `assets/emoji/twitter/` — Twemoji / X (Twitter)
            - `assets/emoji/apple/` — Apple Color Emoji
            - `assets/emoji/facebook/` — Meta (Facebook) emoji

            **Fonts**
            - `assets/fonts/NotoColorEmoji.woff2` — Noto COLR font for grid

            **Data**
            - `assets/emoji/emoji.json` — emoji-datasource v14.0.0

            ### Next step
            After merging, set `LOCAL_ASSETS = true` in `js/sources.js` to switch the app to self-hosted files.

            ---
            _Triggered manually — review before merging._
          commit-message: "chore: update emoji assets from CDN"
          labels: assets,automated
          add-paths: |
            assets/emoji/**
            assets/fonts/**
